name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports: [ "5432:5432" ]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: giftstore
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies (monorepo)
        run: pnpm install

      - name: Create api/.env (local Postgres)
        run: |
          mkdir -p api
          {
            echo "NODE_ENV=test"
            echo "PORT=4000"
            echo "SITE_URL=${{ secrets.SITE_URL }}"
            echo "API_URL=http://localhost:4000"
            echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/giftstore?schema=public"
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
            echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}"
            echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}"
            echo "SMTP_HOST=${{ secrets.SMTP_HOST }}"
            echo "SMTP_PORT=${{ secrets.SMTP_PORT }}"
            echo "SMTP_USER=${{ secrets.SMTP_USER }}"
            echo "SMTP_PASS=${{ secrets.SMTP_PASS }}"
            echo "SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}"
          } > api/.env

      # (opcjonalnie) gdyby kiedyś były flaki związane z engine Prisma
      # - name: Clean Prisma engines cache (optional)
      #   working-directory: api
      #   run: rm -rf node_modules/.prisma

      - name: Generate Prisma Client
        working-directory: api
        run: pnpm prisma:generate

      - name: Run Prisma migrations (deploy)
        working-directory: api
        run: pnpm prisma:deploy

      - name: Seed DB (optional)
        working-directory: api
        run: pnpm db:seed || true

      - name: Build all packages
        run: pnpm -r build

      - name: Run tests (if present)
        run: pnpm -r test --if-present
