name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: giftstore
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies (monorepo)
        run: pnpm install --frozen-lockfile

      - name: Create api/.env (local Postgres)
        run: |
          cat > api/.env << 'EOF'
          NODE_ENV=test
          PORT=4000
          SITE_URL=${{ secrets.SITE_URL }}
          API_URL=http://localhost:4000
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/giftstore?schema=public
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}
          EOF

      - name: Generate Prisma Client
        working-directory: api
        run: pnpm prisma:generate

      - name: Run Prisma migrations (deploy)
        working-directory: api
        run: pnpm prisma:deploy

      - name: Seed DB (optional)
        working-directory: api
        run: pnpm db:seed || true

      - name: Build all packages
        run: pnpm -r build

      - name: Run tests (if present)
        run: pnpm -r test --if-present
