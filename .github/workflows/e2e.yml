name: E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports: [ "5432:5432" ]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: giftstore
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies (monorepo)
        run: pnpm install --frozen-lockfile

      # PNPM 10 blokuje skrypty build; odblokuj Cypress
      - name: Approve Cypress build scripts
        run: pnpm approve-builds cypress

      # Zainstaluj/zwerfikuj binarkę Cypress (będzie cachowana)
      - name: Install Cypress binary
        run: pnpm exec cypress install

      - name: Create api/.env (local Postgres + disable OAuth)
        run: |
          mkdir -p api
          {
            echo "NODE_ENV=test"
            echo "PORT=4000"
            echo "SITE_URL=http://localhost:3000"
            echo "API_URL=http://localhost:4000"
            echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/giftstore?schema=public"
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
            echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}"
            echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}"
            echo "SMTP_HOST=${{ secrets.SMTP_HOST }}"
            echo "SMTP_PORT=${{ secrets.SMTP_PORT }}"
            echo "SMTP_USER=${{ secrets.SMTP_USER }}"
            echo "SMTP_PASS=${{ secrets.SMTP_PASS }}"
            echo "SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}"
            echo "AUTH_DISABLE_OAUTH=true"
          } > api/.env

      - name: Prisma migrate
        working-directory: api
        run: pnpm prisma:migrate

      - name: Build API
        working-directory: api
        run: pnpm build

      - name: Build Web
        working-directory: web
        run: pnpm build

      # 🔧 Fallback: jeżeli nie masz cypress.config.* w web/, utworzymy minimalny
      # i dodamy prosty smoke test, by pipeline nie wybuchał.
      - name: Ensure Cypress project in web/
        run: |
          mkdir -p web/cypress/e2e web/cypress/support web/cypress/fixtures
          if [ ! -f "web/cypress.config.ts" ] && [ ! -f "web/cypress.config.js" ]; then
            cat > web/cypress.config.ts <<'CFG'
            import { defineConfig } from "cypress";
            export default defineConfig({
              e2e: {
                specPattern: "cypress/e2e/**/*.cy.{js,jsx,ts,tsx}",
                supportFile: "cypress/support/e2e.ts",
                fixturesFolder: "cypress/fixtures",
                videosFolder: "cypress/videos",
                screenshotsFolder: "cypress/screenshots",
                baseUrl: "http://localhost:3000",
              },
            });
            CFG
          fi
          if [ ! -f "web/cypress/support/e2e.ts" ]; then
            echo "// support file" > web/cypress/support/e2e.ts
          fi
          # jeżeli nie ma żadnych speców, dodajemy smoke test
          if [ -z "$(ls -1 web/cypress/e2e 2>/dev/null)" ]; then
            cat > web/cypress/e2e/smoke.cy.ts <<'SPEC'
            describe('smoke', () => {
              it('loads home page', () => {
                cy.visit('/');
                cy.contains('html');
              });
              it('api health works', () => {
                cy.request('http://localhost:4000/api/health')
                  .its('status').should('eq', 200);
              });
            });
            SPEC
          fi

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          project: web
          start: |
            pnpm --dir api start
            pnpm --dir web preview --port 3000 --strictPort
          wait-on: >-
            http://localhost:3000, http://localhost:4000/api/health
          wait-on-timeout: 180
        env:
          CYPRESS_BASE_URL: http://localhost:3000
          # opcjonalnie wyłącz nagrywanie wideo, by logi były lżejsze:
          CYPRESS_VIDEO: 'false'
