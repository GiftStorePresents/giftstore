name: E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports: [ "5432:5432" ]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: giftstore
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ✅ Corepack + Node (bez konfliktów z pnpm/action-setup)
      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Create api/.env (local Postgres)
        run: |
          mkdir -p api
          {
            echo "NODE_ENV=test"
            echo "PORT=4000"
            echo "SITE_URL=http://localhost:3000"
            echo "API_URL=http://localhost:4000"
            echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/giftstore?schema=public"
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
            echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}"
            echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}"
            echo "SMTP_HOST=${{ secrets.SMTP_HOST }}"
            echo "SMTP_PORT=${{ secrets.SMTP_PORT }}"
            echo "SMTP_USER=${{ secrets.SMTP_USER }}"
            echo "SMTP_PASS=${{ secrets.SMTP_PASS }}"
            echo "SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}"
          } > api/.env

      - name: Prisma migrate
        working-directory: api
        run: pnpm prisma:migrate

      - name: Build web
        run: pnpm --filter web build

      - name: Start API
        working-directory: api
        run: pnpm start &

      - name: Preview web
        working-directory: web
        run: pnpm preview --port 3000 &

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          wait-on: 'http://localhost:3000, http://localhost:4000/api/health'
          wait-on-timeout: 120000
        env:
          CYPRESS_BASE_URL: http://localhost:3000
