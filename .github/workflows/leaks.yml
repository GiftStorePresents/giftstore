name: Leaks

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read
  security-events: write  # potrzebne do uploadu SARIF

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # pełna historia do skanu

      # ✅ Używamy oficjalnej akcji (bez ręcznej instalacji binarki)
      - name: Run gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: >
            detect
            --source .
            --config .gitleaks.toml
            --redact
            --no-banner
            --report-format sarif
            --report-path gitleaks.sarif
            --exit-code 1

      # ⬆️ Upload SARIF tylko, gdy to NIE jest PR z forka i gdy repo ma włączony Code scanning
      - name: Upload SARIF to Code Scanning
        if: |
          always() &&
          !(
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.fork == true
          )
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif

      # Zawsze dodaj raport jako artefakt (zobaczysz nawet w PR z forka / bez Code scanning)
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
