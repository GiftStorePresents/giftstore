name: Leaks

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read
  security-events: write  # wymagane do uploadu SARIF (jeśli włączysz Code Scanning)

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ✅ Oficjalna akcja (Docker) – zero ręcznych instalacji
      - name: Run gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true   # nie przerywaj – pozwól nam wgrać raport i potem świadomie sfailować job
        with:
          args: >
            detect
            --source .
            --config .gitleaks.toml
            --redact
            --no-banner
            --report-format sarif
            --report-path gitleaks.sarif
            --exit-code 1

      # ⬆️ Upload SARIF do Code Scanning TYLKO jeśli raport istnieje
      # i PR nie pochodzi z forka (token z forka ma za małe uprawnienia)
      - name: Upload SARIF to Code Scanning
        if: |
          always() &&
          hashFiles('gitleaks.sarif') != '' &&
          !(
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.fork == true
          )
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif

      # 📎 Zawsze dołącz raport jako artefakt, ale tylko jeśli istnieje
      - name: Upload SARIF artifact
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif

      # ❌ Jeśli gitleaks znalazł wycieki (krok miał outcome=failure) – sfailuj job
      - name: Fail if leaks found
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "Gitleaks found potential secrets. Failing the job."
          exit 1
