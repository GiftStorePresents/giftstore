<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta name="theme-color" content="#D7263D" />

    <!-- Favicons (ścieżki bez %PUBLIC_URL%) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/logo32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/logo192.png" />
    <link rel="apple-touch-icon" href="/icons/logo192.png" />

    <!-- SEO -->
    <title>Gift Store – Wyjątkowe prezenty na każdą okazję</title>
    <meta
      name="description"
      content="Gift Store – najlepsze pomysły na prezenty dla niej, dla niego, dla dzieci i na każdą okazję. Sklep internetowy z wyjątkowymi prezentami."
    />
    <meta
      name="keywords"
      content="prezenty, sklep z prezentami, dla niej, dla niego, dla dzieci, na urodziny, gift store"
    />
    <meta name="author" content="Gift Store" />
    <link rel="canonical" href="https://twoja-domena.pl/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pl_PL" />
    <meta property="og:site_name" content="Gift Store" />
    <meta property="og:title" content="Gift Store – Wyjątkowe prezenty" />
    <meta
      property="og:description"
      content="Znajdź idealny prezent na każdą okazję! Dla niej, dla niego, dla dzieci i więcej."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:url" content="https://twoja-domena.pl/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gift Store – Wyjątkowe prezenty" />
    <meta
      name="twitter:description"
      content="Znajdź idealny prezent na każdą okazję! Dla niej, dla niego, dla dzieci i więcej."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Manifest PWA -->
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <noscript>Musisz włączyć JavaScript, aby korzystać z tej aplikacji.</noscript>
    <div id="root"></div>

    <!-- Hidden search input to fix "id/name" warning -->
    <form style="display:none" aria-hidden="true">
      <input type="text" id="hidden-search" name="search" />
    </form>

    <!-- Wejście do aplikacji (Vite) -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
